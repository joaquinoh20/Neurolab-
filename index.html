<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;font:14px system-ui,sans-serif}</style></head><body><title>NeuroLab Enterprise</title>

<style>
/* Layout: menú lateral compacto + encabezado con contexto (proyecto, migas, perfil) + área de trabajo por módulo M01–M10 */
:root{
  --bg:#F2F5F9;--surface:#FFFFFF;--fg:#142235;--muted:#566A7E;--line:#D5DDE7;
  --nav:#14283F;--nav-fg:#C9D7E6;--nav-on:#223F60;

  --ok:#11775A;--warn:#8A5A00;--bad:#B42F2F;--okbg:#E2F3EC;--warnbg:#FBF0D9;--badbg:#FBE5E5;
  --code-bg:#0F1A24;--code-fg:#D6E4F2;
  --f-head:'Space Grotesk','Inter',system-ui,sans-serif;
  --f-body:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --f-mono:'JetBrains Mono',ui-monospace,'Cascadia Mono',Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C131A;--surface:#141E28;--fg:#E5ECF3;--muted:#92A3B4;--line:#25333F;
    --nav:#091017;--nav-fg:#B6C6D6;--nav-on:#1A2B3D;
    --accent:#6FA3FF;--accent-fg:#0C131A;--soft:#172840;
    --ok:#4CC9A0;--warn:#E3B341;--bad:#F27D7D;--okbg:#10291F;--warnbg:#2D2410;--badbg:#321818;
    --code-bg:#091016;--code-fg:#D6E4F2;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C131A;--surface:#141E28;--fg:#E5ECF3;--muted:#92A3B4;--line:#25333F;
  --nav:#091017;--nav-fg:#B6C6D6;--nav-on:#1A2B3D;
  --accent:#6FA3FF;--accent-fg:#0C131A;--soft:#172840;
  --ok:#4CC9A0;--warn:#E3B341;--bad:#F27D7D;--okbg:#10291F;--warnbg:#2D2410;--badbg:#321818;
  --code-bg:#091016;--code-fg:#D6E4F2;color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:14px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

h2{font-size:17px}h3{font-size:14px}
a{color:var(--accent)}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.nav{background:var(--nav);color:var(--nav-fg);position:sticky;top:env(safe-area-inset-top,0px);height:100vh;overflow:auto;display:flex;flex-direction:column;padding:14px 8px;padding-left:max(8px,env(safe-area-inset-left,0px))}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 14px;color:#fff;font:600 16px var(--f-head)}
.brand svg{color:#8DB4FF;flex:none}
.nav button{all:unset;box-sizing:border-box;display:flex;gap:10px;align-items:center;width:100%;padding:8px 10px;border-radius:6px;cursor:pointer;font-size:13px}
.nav button:hover{background:var(--nav-on)}
.nav button[aria-current="page"]{background:var(--nav-on);color:#fff;box-shadow:inset 3px 0 0 #8DB4FF}
.nav button:focus-visible{outline:2px solid #8DB4FF;outline-offset:-2px}
.nav .mid{font:500 10px var(--f-mono);color:#8DB4FF;min-width:26px}
.nav .sp{flex:1}
.nav .small{padding:8px 10px;font-size:11px;color:#8FA3B8}
.main{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.topin{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;justify-content:space-between;padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:13px;color:var(--muted);min-width:0}
.crumbs b{color:var(--fg);font-weight:600}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--bg);padding:4px 10px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.chip .d{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.chip.off .d{background:var(--bad)}
.menu{display:none}
.page{padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px;min-width:0}
.pagehead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:flex-end;justify-content:space-between}
.pagehead h1{font-size:21px;letter-spacing:-.01em}
.pagehead p{margin:2px 0 0;color:var(--muted);max-width:70ch}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:16px;min-width:0}
.ph{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between;margin-bottom:12px}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:16px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:12px 14px}
.card span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.card b{display:block;font:500 24px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px}
.card small{color:var(--muted)}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto}
.tab{background:none;border:0;border-bottom:2px solid transparent;padding:8px 14px;cursor:pointer;font-weight:500;color:var(--muted);white-space:nowrap}

.btn{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 13px;font:inherit;font-weight:500;color:var(--fg);cursor:pointer}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.sm{padding:3px 9px;font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px;margin-bottom:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:500;color:var(--muted);min-width:0}
input:not([type]),input[type=text],input[type=password],input[type=email],input[type=number],input[type=search],select,textarea,input[type=file]{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 8px;width:100%;min-width:0}
textarea{resize:vertical;min-height:64px}
input[type=range]{width:100%;accent-color:var(--accent)}
.hint{color:var(--muted);font-size:13px;margin:0 0 10px}
.msg{font-size:13px;margin:8px 0 0}
.banner{border-radius:6px;padding:8px 12px;font-size:13px;margin:0 0 12px;border:1px solid var(--line)}
.banner.bad{background:var(--badbg);color:var(--bad);border-color:var(--bad)}
.banner.warn{background:var(--warnbg);color:var(--warn);border-color:var(--warn)}
.banner.ok{background:var(--okbg);color:var(--ok);border-color:var(--ok)}
.banner ul{margin:4px 0 0;padding-left:18px}
.empty{border:1px dashed var(--line);border-radius:8px;padding:24px;text-align:center;color:var(--muted)}
.empty h3{color:var(--fg);margin-bottom:4px}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th,table.t td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t th{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;background:var(--bg);white-space:nowrap}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
table.t tr.sel td{background:var(--soft)}
.mono{font-family:var(--f-mono);font-size:12px}
.muted{color:var(--muted)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:2px 10px;font-size:12px;font-weight:600;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.pill::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--muted)}
.pill.QUEUED::before,.pill.borrador::before,.pill.retirado::before,.pill.CANCELLED::before{border-radius:2px}
.pill.PREPARING::before,.pill.revisado::before{background:var(--warn)}
.pill.RUNNING::before{background:var(--accent)}
.pill.COMPLETED::before,.pill.aprobado::before,.pill.activo::before{background:var(--ok)}
.pill.FAILED::before,.pill.suspendido::before{background:var(--bad);border-radius:1px;transform:rotate(45deg)}
.prog{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent)}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.tile{border-left:3px solid var(--accent);padding:2px 0 2px 10px}
.tile span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.tile b{font:500 19px var(--f-mono);font-variant-numeric:tabular-nums}
.code{background:var(--code-bg);color:var(--code-fg);border-radius:6px;padding:12px;margin:0;font:12px/1.55 var(--f-mono);overflow:auto;max-height:320px;white-space:pre}
.kv{display:grid;grid-template-columns:minmax(110px,170px) 1fr;gap:6px 14px;margin:0;font-size:13px}
.kv dt{color:var(--muted)}.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
canvas{display:block;width:100%}
.chart{aspect-ratio:16/10;border:1px solid var(--line);border-radius:6px}
.charts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:12px}
.designer{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}
@media (min-width:1180px){.designer{grid-template-columns:260px minmax(0,1fr) 270px}}
.li{display:flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:6px;padding:6px 8px;margin-bottom:6px;background:var(--bg)}
.li[aria-current="true"]{border-color:var(--accent);background:var(--soft)}
.li .lb{flex:1;all:unset;cursor:pointer;flex:1;font-size:13px;min-width:0;overflow-wrap:anywhere}
.li .lb:focus-visible{outline:2px solid var(--accent)}
.li button.sm{padding:1px 7px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;flex-wrap:wrap}
.seg button{background:var(--surface);border:0;padding:6px 12px;font:inherit;font-weight:500;color:var(--fg);cursor:pointer;border-right:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.step{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.step span{padding:3px 10px;border-radius:999px;border:1px solid var(--line);font-size:12px;color:var(--muted)}
.step span.on{border-color:var(--accent);color:var(--accent);font-weight:600}
.step span.done{background:var(--soft);color:var(--fg)}
.cm th,.cm td{border:1px solid var(--line);padding:6px 10px;text-align:center;font:12px var(--f-mono)}
.nd{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}.nd.out{fill:var(--accent)}
.ln{stroke:var(--line);stroke-width:1}
.tl{fill:var(--fg);font:600 12px var(--f-body)}.sl{fill:var(--muted);font:11px var(--f-mono)}
.bx{fill:var(--surface);stroke:var(--accent);stroke-width:1.5}
.who{display:flex;gap:8px;align-items:center}
.who img{width:26px;height:26px;border-radius:50%;flex:none}
.scrim{display:none}
.v3{position:relative;aspect-ratio:16/10;border:1px solid var(--line);border-radius:6px;overflow:hidden;background:var(--bg);touch-action:none}
.v3 canvas{position:absolute;inset:0;width:100%;height:100%;cursor:grab}
.v3 .tb{position:absolute;left:8px;bottom:8px;display:flex;gap:4px;flex-wrap:wrap}
.v3 .tb button{font-size:12px;padding:3px 9px}
.v3 .hintb{position:absolute;right:10px;top:8px;font-size:11px;color:var(--muted)}
.sr{display:flex}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .nav{position:fixed;left:0;top:0;bottom:0;width:260px;height:auto;z-index:30;transform:translateX(-100%);transition:transform .15s;padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(14px + env(safe-area-inset-bottom,0px))}
  .app.open .nav{transform:none}
  .app.open .scrim{display:block;position:fixed;inset:0;background:#0008;z-index:20}
  .menu{display:inline-flex}
}
@media (prefers-reduced-motion:reduce){.nav{transition:none}}
</style>

<script>
(function(){
'use strict';
/* ===== Utilidades ===== */
const g=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const clone=o=>JSON.parse(JSON.stringify(o));
const now=()=>Date.now();
const fmtDT=t=>t?new Date(t).toLocaleString('es-PE',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit',hour12:false}):'—';
const fmtDur=ms=>{if(ms==null||isNaN(ms))return '—';const s=Math.round(ms/1000);return s<60?s+' s':Math.floor(s/60)+' min '+(s%60)+' s';};
const pct=v=>(v==null||isNaN(v))?'—':(v*100).toFixed(1)+'%';
const rid=p=>p+now().toString(36)+Math.random().toString(36).slice(2,6);
const sid=id=>String(id||'').slice(-5).toUpperCase();
const cssVar=n=>getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const csvCell=v=>{let s=String(v==null?'':v);if(/^[=+\-@\t\r]/.test(s))s="'"+s;return /[",\n;]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
const isInt=(v,a,b)=>Number.isInteger(v)&&v>=a&&v<=b;

/* ===== Constantes del dominio ===== */
const DEFAULTS={maxConcurrent:1,maxEpochs:300,maxParams:50000,maxLayers:20,maxJobSeconds:180,maxUploadKB:512,maxDatasetRows:5000,ratePerMin:6,maxActiveJobsPerProject:3,maxDatasetsPerProject:12,memoryMB:512,cpuPauseMs:0,backend:'cpu',retentionDays:365,quotaKB:4096};
const LVL={viewer:1,editor:2,owner:3,admin:4};
const ROLE_ES={viewer:'Lector',editor:'Editor',owner:'Propietario',admin:'Administrador'};
const ACTION_MIN={read:'viewer',write:'editor',cancel:'editor',review:'editor',export:'editor',approve:'owner',manage:'owner'};
const canDo=(role,a)=>!!role&&LVL[role]>=LVL[ACTION_MIN[a]];
const NEXT={QUEUED:['PREPARING','CANCELLED','FAILED'],PREPARING:['RUNNING','FAILED','CANCELLED'],RUNNING:['COMPLETED','FAILED','CANCELLED'],COMPLETED:[],FAILED:[],CANCELLED:[]};
const STATE_ES={QUEUED:'En cola',PREPARING:'Preparando',RUNNING:'Ejecutando',COMPLETED:'Completado',FAILED:'Fallido',CANCELLED:'Cancelado'};
const MV_NEXT={borrador:['revisado'],revisado:['aprobado','borrador'],aprobado:['retirado'],retirado:[]};
const MV_MIN={borrador:'editor',revisado:'editor',aprobado:'owner',retirado:'owner'};
const PAL=['#0072B2','#E69F00','#009E73','#CC79A7','#56B4E9','#D55E00'];
const ACTS=['relu','tanh','sigmoid','elu','linear'];
const OPTS={adam:'Adam',sgd:'SGD',rmsprop:'RMSprop',adagrad:'Adagrad'};
const HB_STALE=45000;

/* ===== Errores de la capa API ===== */
class HttpError extends Error{constructor(s,m,d){super(m);this.status=s;this.details=d||[];}}
const E=(s,m,d)=>new HttpError(s,m,d);

/* ===== Datos sintéticos y CSV ===== */
const GEN={circles:['Círculos concéntricos',2],xor:['XOR',2],moons:['Dos lunas',2],blobs:['Tres grupos',3],spiral:['Espiral',3]};
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296;};}
function genData(kind,n,noise,seed){
  const R=rng(seed),rn=()=>{let u=0;while(u===0)u=R();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*R());};
  const X=[],y=[];let i,c,t,r;
  if(kind==='xor'){for(i=0;i<n;i++){const a=R()*2-1,b=R()*2-1;X.push([a+rn()*noise*.5,b+rn()*noise*.5]);y.push(a*b>0?1:0);}}
  else if(kind==='circles'){for(i=0;i<n;i++){c=i%2;r=(c?.4:.9)+rn()*noise*.4;t=R()*6.2832;X.push([r*Math.cos(t),r*Math.sin(t)]);y.push(c);}}
  else if(kind==='moons'){for(i=0;i<n;i++){c=i%2;t=R()*Math.PI;X.push([(c?1-Math.cos(t):Math.cos(t))+rn()*noise,(c?.5-Math.sin(t):Math.sin(t))+rn()*noise]);y.push(c);}}
  else if(kind==='blobs'){const C3=[[-.6,-.5],[.6,-.4],[0,.7]];for(i=0;i<n;i++){c=i%3;const s=.14+noise*.6;X.push([C3[c][0]+rn()*s,C3[c][1]+rn()*s]);y.push(c);}}
  else{const per=Math.floor(n/3);for(c=0;c<3;c++)for(i=0;i<per;i++){r=i/per;t=r*4+c*2.0944+rn()*noise*.6;X.push([r*Math.cos(t),r*Math.sin(t)]);y.push(c);}}
  return{X,y,classes:['Clase A','Clase B','Clase C'].slice(0,GEN[kind][1]),featNames:['x1','x2']};
}
function validateCSV(text,meta,S){
  const checks=[],add=(ok,msg)=>{checks.push({ok,msg});return ok;};
  S=S||DEFAULTS;meta=meta||{};
  if(!meta.skip){
    add(/\.(csv|txt)$/i.test(meta.fileName||''),'Extensión permitida (.csv o .txt)');
    add((meta.size||text.length)<=S.maxUploadKB*1024,'Tamaño dentro del límite ('+S.maxUploadKB+' KB)');
    add(!meta.mime||/^(text\/(csv|plain)|application\/(vnd\.ms-excel|csv))$/.test(meta.mime),'Tipo MIME de texto');
  }
  const bin=/[\u0000-\u0008\u000E-\u001F]/.test(text.slice(0,4096));
  add(!bin,'Contenido de texto plano (no se ejecuta ni interpreta código)');
  let data=null;
  if(!bin){
    try{
      const lines=text.split(/\r?\n/).map(l=>l.trim()).filter(Boolean);
      if(lines.length<11)throw new Error('Se necesitan al menos 10 filas de datos.');
      const sep=lines[0].split(';').length>lines[0].split(',').length?';':',';
      const rows=lines.map(l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,'')));
      const w=rows[0].length;
      if(w<2)throw new Error('Se necesitan al menos 2 columnas: variables y clase.');
      let header=null;
      if(!rows[0].slice(0,w-1).every(c=>c!==''&&!isNaN(Number(c))))header=rows.shift();
      const body=rows.filter(r=>r.length===w);
      if(body.length<10)throw new Error('Quedaron menos de 10 filas válidas; revisa el separador.');
      if(body.length>S.maxDatasetRows)throw new Error('Máximo '+S.maxDatasetRows+' filas; el archivo trae '+body.length+'.');
      if(w-1>100)throw new Error('Máximo 100 variables.');
      const X=body.map(r=>r.slice(0,w-1).map(Number));
      if(X.some(r=>r.some(v=>!isFinite(v))))throw new Error('Las variables deben ser numéricas y sin celdas vacías (la última columna es la clase).');
      const labs=body.map(r=>r[w-1]);let u=Array.from(new Set(labs));
      if(u.length<2)throw new Error('La columna de clase necesita al menos 2 valores distintos.');
      if(u.length>6)throw new Error('Máximo 6 clases; hay '+u.length+'.');
      if(u.every(v=>!isNaN(Number(v))))u.sort((a,b)=>a-b);
      data={X,y:labs.map(l=>u.indexOf(l)),classes:u.map(String),featNames:header?header.slice(0,w-1):Array.from({length:w-1},(_,i)=>'x'+(i+1))};
      add(true,body.length+' filas · '+(w-1)+' variables · '+u.length+' clases');
    }catch(e){add(false,e.message);}
  }
  return{ok:checks.every(c=>c.ok),checks,data};
}

/* ===== Validación de arquitecturas (reglas del backend) ===== */
const FAMS={
  Feedforward:{train:true,types:['dense','dropout'],doc:'Capas densas totalmente conectadas (MLP).'},
  RNN:{train:false,types:['simplernn','lstm','gru','dropout','dense'],doc:'Secuencias: RNN simple, LSTM o GRU.'},
  CNN:{train:false,types:['conv2d','maxpool2d','flatten','dropout','dense'],doc:'Imágenes: convoluciones y pooling.'},
  GAN:{train:false,types:['dense','dropout'],doc:'Generador y discriminador.'}
};
const LNAME={dense:'Densa',dropout:'Dropout',lstm:'LSTM',gru:'GRU',simplernn:'RNN simple',conv2d:'Conv2D',maxpool2d:'MaxPool2D',flatten:'Flatten'};
const LDEF={dense:{units:16,act:'relu'},dropout:{rate:0.2},lstm:{units:32},gru:{units:32},simplernn:{units:32},conv2d:{filters:8,kernel:3,act:'relu'},maxpool2d:{size:2},flatten:{}};
const shp=s=>'('+s.join(', ')+')';
const RECUR=['lstm','gru','simplernn'];
function runStack(inShape,layers,label,errs,family,group){
  let sh=inShape.slice(),rows=[],total=0,seenDense=false;
  layers.forEach((l,i)=>{
    const where=label+(i+1),nm=where+' · '+(LNAME[l.type]||l.type);let p=0,out=sh,det='';
    if(!FAMS[family].types.includes(l.type)){errs.push(where+': el tipo «'+l.type+'» no existe en la familia '+family+'.');rows.push({name:nm,shape:shp(sh),params:0,det:'no válida',group});return;}
    if(l.type==='dense'){
      if(sh.length!==1)errs.push(where+': la capa Densa necesita entrada plana; la forma actual es '+shp(sh)+'.'+(family==='CNN'?' Agrega Flatten antes.':''));
      if(!isInt(l.units,1,512))errs.push(where+': neuronas debe ser un entero entre 1 y 512.');
      if(!ACTS.includes(l.act))errs.push(where+': activación no válida.');
      if(sh.length===1&&isInt(l.units,1,512)){p=sh[0]*l.units+l.units;out=[l.units];}
      seenDense=true;det=l.act;
    }else if(l.type==='dropout'){
      if(!(typeof l.rate==='number'&&l.rate>=0&&l.rate<=0.9))errs.push(where+': la tasa de dropout debe estar entre 0 y 0.9.');
      det='tasa '+l.rate;
    }else if(RECUR.includes(l.type)){
      if(seenDense)errs.push(where+': las capas recurrentes deben ir antes de las densas.');
      if(sh.length!==2)errs.push(where+': la capa recurrente necesita una secuencia (pasos, variables); forma actual '+shp(sh)+'.');
      if(!isInt(l.units,1,256))errs.push(where+': unidades debe ser un entero entre 1 y 256.');
      if(sh.length===2&&isInt(l.units,1,256)){
        const u=l.units,f=sh[1];
        p=l.type==='lstm'?4*(f*u+u*u+u):l.type==='gru'?3*(f*u+u*u+2*u):(f*u+u*u+u);
        const more=layers.slice(i+1).some(x=>RECUR.includes(x.type));
        out=more?[sh[0],u]:[u];det=more?'devuelve secuencia':'devuelve último paso';
      }
    }else if(l.type==='conv2d'){
      if(sh.length!==3)errs.push(where+': Conv2D necesita imagen (alto, ancho, canales); forma actual '+shp(sh)+'.');
      if(!isInt(l.filters,1,256))errs.push(where+': filtros debe ser un entero entre 1 y 256.');
      if(!isInt(l.kernel,1,7))errs.push(where+': el kernel debe ser un entero entre 1 y 7.');
      if(sh.length===3&&isInt(l.filters,1,256)&&isInt(l.kernel,1,7)){
        if(l.kernel>sh[0]||l.kernel>sh[1])errs.push(where+': el kernel '+l.kernel+' excede la imagen '+shp(sh)+'.');
        else{p=l.kernel*l.kernel*sh[2]*l.filters+l.filters;out=[sh[0]-l.kernel+1,sh[1]-l.kernel+1,l.filters];}
      }
      det=l.kernel+'×'+l.kernel+' · '+l.act;
    }else if(l.type==='maxpool2d'){
      if(sh.length!==3)errs.push(where+': MaxPool2D necesita imagen; forma actual '+shp(sh)+'.');
      if(!isInt(l.size,2,4))errs.push(where+': el tamaño de pooling debe ser 2, 3 o 4.');
      if(sh.length===3&&isInt(l.size,2,4)){
        if(l.size>sh[0]||l.size>sh[1])errs.push(where+': el pooling '+l.size+' excede la forma '+shp(sh)+'.');
        else out=[Math.floor(sh[0]/l.size),Math.floor(sh[1]/l.size),sh[2]];
      }
      det='ventana '+l.size;
    }else if(l.type==='flatten'){
      if(sh.length<2)errs.push(where+': la entrada ya es plana.');
      else out=[sh.reduce((a,b)=>a*b,1)];
    }
    sh=out;total+=p;rows.push({name:nm,shape:shp(sh),params:p,det,group});
  });
  return{sh,rows,total};
}
function validateArch(family,cfg,maxL){
  const errs=[];let rows=[],params=0;maxL=maxL||DEFAULTS.maxLayers;
  if(!FAMS[family])return{ok:false,errors:['Familia no reconocida: '+family+'.'],rows,params:0};
  if(!cfg||typeof cfg!=='object')return{ok:false,errors:['Configuración vacía.'],rows,params:0};
  if(family==='GAN'){
    if(!isInt(cfg.latent_dim,2,256))errs.push('Dimensión latente: entero entre 2 y 256.');
    if(!isInt(cfg.data_dim,1,256))errs.push('Dimensión de los datos: entero entre 1 y 256.');
    [['generator','Generador','G'],['discriminator','Discriminador','D']].forEach(([k,nm,lb])=>{
      if(!Array.isArray(cfg[k])||cfg[k].length<1)errs.push('El '+nm.toLowerCase()+' necesita al menos una capa oculta.');
      else if(cfg[k].length>maxL)errs.push('El '+nm.toLowerCase()+' supera el máximo de '+maxL+' capas.');
    });
    if(!errs.length){
      const gs=runStack([cfg.latent_dim],cfg.generator,'G',errs,family,'Generador');
      rows.push({name:'G · Entrada latente',shape:shp([cfg.latent_dim]),params:0,det:'',group:'Generador'},...gs.rows);
      const go=gs.sh.length===1?gs.sh[0]*cfg.data_dim+cfg.data_dim:0;
      rows.push({name:'G · Salida',shape:shp([cfg.data_dim]),params:go,det:'tanh',group:'Generador'});
      const ds=runStack([cfg.data_dim],cfg.discriminator,'D',errs,family,'Discriminador');
      rows.push({name:'D · Entrada datos',shape:shp([cfg.data_dim]),params:0,det:'',group:'Discriminador'},...ds.rows);
      const dout=ds.sh.length===1?ds.sh[0]+1:0;
      rows.push({name:'D · Salida',shape:'(1)',params:dout,det:'sigmoid',group:'Discriminador'});
      params=gs.total+go+ds.total+dout;
    }
  }else{
    const inp=cfg.input,need={Feedforward:1,RNN:2,CNN:3}[family];
    const lim={Feedforward:[[1,100]],RNN:[[1,500],[1,100]],CNN:[[4,128],[4,128],[1,4]]}[family];
    if(!Array.isArray(inp)||inp.length!==need||inp.some((v,i)=>!isInt(v,lim[i][0],lim[i][1])))errs.push('Forma de entrada no válida para '+family+' (revisa los límites de cada dimensión).');
    if(!Array.isArray(cfg.layers))errs.push('Las capas deben ser una lista.');
    else if(cfg.layers.length>maxL)errs.push('Máximo '+maxL+' capas ocultas.');
    if(!isInt(cfg.out,1,100))errs.push('Las neuronas de salida deben ser un entero entre 1 y 100.');
    if(!errs.length){
      rows.push({name:'Entrada',shape:shp(inp),params:0,det:''});
      const r=runStack(inp,cfg.layers,'C',errs,family);
      rows.push(...r.rows);params=r.total;
      if(r.sh.length!==1)errs.push('La salida necesita una entrada plana; forma actual '+shp(r.sh)+(family==='CNN'?'. Agrega Flatten.':'.'));
      else{const p=r.sh[0]*cfg.out+cfg.out;params+=p;rows.push({name:'Salida',shape:shp([cfg.out]),params:p,det:cfg.out===1?'sigmoid':'softmax'});}
    }
  }
  return{ok:errs.length===0,errors:errs,rows,params};
}
function defaultCfg(f){
  if(f==='RNN')return{input:[20,4],layers:[{type:'lstm',units:32},{type:'dropout',rate:0.2}],out:2};
  if(f==='CNN')return{input:[16,16,1],layers:[{type:'conv2d',filters:8,kernel:3,act:'relu'},{type:'maxpool2d',size:2},{type:'flatten'},{type:'dense',units:16,act:'relu'}],out:3};
  if(f==='GAN')return{latent_dim:8,data_dim:2,generator:[{type:'dense',units:16,act:'relu'}],discriminator:[{type:'dense',units:16,act:'relu'}]};
  return{input:[2],layers:[{type:'dense',units:16,act:'relu'},{type:'dense',units:8,act:'relu'}],out:3};
}
function kerasCode(a,p){
  if(a.family!=='Feedforward')return '# La familia '+a.family+' está documentada; su entrenamiento aún no está habilitado.';
  const c=a.config_json,n=c.out,L=['    layers.Input(shape=('+c.input[0]+',)),'];
  c.layers.forEach(l=>L.push(l.type==='dense'?'    layers.Dense('+l.units+', activation="'+l.act+'"),':'    layers.Dropout('+l.rate+'),'));
  L.push('    layers.Dense('+n+', activation="'+(n===1?'sigmoid':'softmax')+'"),');
  return ['import tensorflow as tf','from tensorflow import keras','from tensorflow.keras import layers','','model = keras.Sequential([',...L,'])',
   'model.compile(optimizer=keras.optimizers.'+OPTS[p.optimizer]+'(learning_rate='+p.lr+'),','              loss="'+(n===1?'binary_crossentropy':'categorical_crossentropy')+'",','              metrics=["accuracy"])',
   '# Con 2 o más salidas use etiquetas one-hot.','model.fit(X_train, y_train, validation_data=(X_val, y_val), epochs='+p.epochs+', batch_size='+p.batch+')'].join('\n');
}
async function sha256(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619);}return 'fnv-'+(h>>>0).toString(16).padStart(8,'0');}
}
async function pwHash(pass,salt){
  if(!(window.crypto&&window.crypto.subtle))throw E(500,'Este navegador no permite verificar contraseñas (abre el sistema desde un archivo local, localhost o HTTPS).');
  const k=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveBits']);
  const b=await crypto.subtle.deriveBits({name:'PBKDF2',hash:'SHA-256',salt:new TextEncoder().encode(salt),iterations:100000},k,256);
  return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
}
function splitIdx(n,seed,sp){
  const R=rng(seed+7),idx=Array.from({length:n},(_,i)=>i);
  for(let i=n-1;i>0;i--){const j=Math.floor(R()*(i+1));const t=idx[i];idx[i]=idx[j];idx[j]=t;}
  const nt=Math.floor(n*sp.tr/100),nv=Math.floor(n*sp.va/100);
  return{tr:idx.slice(0,nt),va:idx.slice(nt,nt+nv),te:idx.slice(nt+nv)};
}

const qt=s=>/[",\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;
function cell(c,v){
  if(isJ(c))return qt(JSON.stringify(v==null?(c==='tags'?[]:null):v));
  if(v==null)return '';
  if(typeof v==='number'||typeof v==='boolean')return String(v);

function parseRows(text){
  const rows=[];let row=[],f='',q=false;
  text=text.replace(/^﻿/,'');
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++;}else q=false;}else f+=c;}
    else if(c==='"')q=true;
    else if(c===','){row.push(f);f='';}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(f);f='';rows.push(row);row=[];}
    else f+=c;
  }
  if(f!==''||row.length){row.push(f);rows.push(row);}
  return rows.filter(r=>!(r.length===1&&r[0]===''));
}
function coerce(c,v){
  if(isJ(c)){if(v===''||v==null)return c==='tags'?[]:null;try{return JSON.parse(v);}catch(e){return c==='tags'?[]:null;}}
  if(c==='retry_of'||c==='project_id')return v===''?null:v;
  if(NUMC.has(c))return v===''?null:Number(v);
  if(BOOLC.has(c))return v==='true';
  if(FREE.has(c)&&/^'[=+\-@\t\r]/.test(v))return v.slice(1);
  return v;
}
function tableFromCSV(name,text){

  const head=rows[0].map(h=>h.trim()),miss=TABLES[name].filter(c=>!head.includes(c));
  if(miss.length)throw new Error(name+'.csv: faltan las columnas '+miss.join(', ')+'.');
  return rows.slice(1).map(r=>{const o={};TABLES[name].forEach(c=>{const i=head.indexOf(c);o[c]=coerce(c,i>=0&&r[i]!=null?r[i]:'');});return o;});
}

  if(!key||!password)throw E(422,'Escribe tu usuario y tu contraseña.');
  const f=FAILS[key]||(FAILS[key]={n:0,until:0});
  if(now()<f.until)throw E(429,'Demasiados intentos fallidos. Espera '+Math.ceil((f.until-now())/1000)+' s e inténtalo de nuevo.');
  const u=DB.users.find(x=>String(x.username||'').toLowerCase()===key);
  const okp=!!(u&&u.password_hash&&u.salt&&(await pwHash(String(password),u.salt))===u.password_hash);
  if(!okp){f.n++;if(f.n>=5){f.until=now()+60000;f.n=0;}audit('inicio_sesion_fallido',null,{usuario:key.slice(0,40)},'sistema');persist();throw E(401,'Usuario o contraseña incorrectos.');}
  if(u.status!=='activo')throw E(403,'La cuenta está suspendida.');
  f.n=0;SES=u.id;try{sessionStorage.setItem(LSS,u.id);}catch(e){}
  audit('inicio_sesion',null,{});persist();return u;
});

svc.createDataset=def('POST','/api/v1/projects/{id}/datasets',async(pid,f)=>{
  const{u}=need(pid,'write'),name=cleanText(f.name,60).replace(/[^\w .\-áéíóúñÁÉÍÓÚÑ]/g,''),errs=[];
  if(name.length<3)errs.push('El nombre necesita al menos 3 caracteres.');
  const sp={tr:Math.round(+f.tr),va:Math.round(+f.va)};
  if(!isInt(sp.tr,50,90)||!isInt(sp.va,5,30)||100-sp.tr-sp.va<5)errs.push('La separación debe dejar entrenamiento 50–90 %, validación 5–30 % y prueba de al menos 5 %.');
  if(DB.datasets.filter(d=>d.project_id===pid).length>=S().maxDatasetsPerProject)errs.push('El proyecto alcanzó el máximo de '+S().maxDatasetsPerProject+' datasets.');
  const id=rid('d');let meta,key;
  if(f.source==='csv'){
    const v=validateCSV(f.text||'',{fileName:f.fileName,size:f.size,mime:f.mime},S());
    if(!v.ok)errs.push(...v.checks.filter(c=>!c.ok).map(c=>c.msg));
    else{
      if(usageKB()+f.text.length/1024>S().quotaKB)errs.push('Cuota de almacenamiento agotada ('+S().quotaKB+' KB).');
      meta={source:'csv',fileName:cleanText(f.fileName,80),rows:v.data.X.length,nFeat:v.data.X[0].length,classes:v.data.classes,featNames:v.data.featNames};
      key='csv_'+id;
    }
  }else{
    if(!GEN[f.kind])errs.push('Tipo de dataset generado no reconocido.');
    const n=Math.round(+f.n),noise=+f.noise;
    if(!isInt(n,60,2000)||!(noise>=0&&noise<=0.4))errs.push('Muestras entre 60 y 2000 y ruido entre 0 y 0.4.');
    if(!errs.length){const sd=Math.floor(Math.random()*9000)+100;const dd=genData(f.kind,n,noise,sd);meta={source:'generado',kind:f.kind,n,noise,seed:sd,rows:dd.X.length,nFeat:2,classes:dd.classes,featNames:dd.featNames};key='gen:'+id;}
  }
  if(errs.length)throw E(422,'No se pudo registrar el dataset.',errs);
  meta.split={tr:sp.tr,va:sp.va,te:100-sp.tr-sp.va};meta.description=cleanText(f.description,300);
  if(f.source==='csv')DB.objects[key]={kind:'dataset',content:f.text};
  const ver=Math.max(0,...DB.datasets.filter(d=>d.project_id===pid&&d.name===name).map(d=>d.version))+1;
  DB.datasets.push({id,project_id:pid,name,version:ver,storage_key:key,metadata_json:meta,created_by:u.id,created_at:now()});
  audit('dataset_registrado',pid,{nombre:name,version:ver,filas:meta.rows,origen:meta.source});persist();bus.emit({type:'data'});return id;
});

/* ===== Trabajos de entrenamiento ===== */
const TERMINAL=['COMPLETED','FAILED','CANCELLED'];
const canTransition=(a,b)=>!!NEXT[a]&&NEXT[a].includes(b);
const isActive=j=>j.status==='QUEUED'||j.status==='PREPARING'||j.status==='RUNNING';
const RUNNING={},LIVEW={};
function jlog(j,m){j.logs_json.push({t:now(),m:cleanText(m,220)});if(j.logs_json.length>60)j.logs_json.shift();}
function transition(j,to,reason){
  if(!canTransition(j.status,to))throw new Error('Transición inválida '+j.status+' → '+to);
  j.status=to;if(reason!=null)j.state_reason=reason;
  if(to==='PREPARING')j.started_at=now();
  if(TERMINAL.includes(to)){j.ended_at=now();if(to==='COMPLETED')j.progress=100;audit('entrenamiento_'+to.toLowerCase(),j.project_id,{job:j.id,motivo:reason||''},'worker');}
  jlog(j,STATE_ES[to]+(reason?': '+reason:''));
  persist();bus.emit({type:'job',id:j.id});
}
function confirmQueuedCancels(){
  DB.training_jobs.filter(j=>j.status==='QUEUED'&&j.cancel_requested).forEach(j=>transition(j,'CANCELLED','Cancelado por solicitud del usuario antes de iniciar (confirmado por el worker).'));
}
function series(jid){
  const s={loss:[],accuracy:[],val_loss:[],val_accuracy:[]};
  DB.training_metrics.forEach(m=>{if(m.job_id===jid&&s[m.metric_name])s[m.metric_name][m.epoch-1]=m.metric_value;});
  return s;
}
function jobRow(j){
  const p=DB.projects.find(x=>x.id===j.project_id),a=DB.architectures.find(x=>x.id===j.architecture_id),d=DB.datasets.find(x=>x.id===j.dataset_id);
  const sn=j.snapshot_json||{};
  return{...j,no:'E-'+sid(j.id),project:p?p.name:'—',arch:sn.architecture?sn.architecture.name+' v'+sn.architecture.version:(a?a.name:'—'),dataset:sn.dataset?sn.dataset.name+' v'+sn.dataset.version:(d?d.name:'—'),
    dur:j.started_at?(j.ended_at||now())-j.started_at:null,by:uname(j.created_by)};
}
svc.createJob=def('POST','/api/v1/projects/{id}/training-jobs',async(pid,f)=>{
  const{u,r}=need(pid,'write'),st=S();
  if(DB.training_jobs.filter(j=>j.created_by===u.id&&now()-j.created_at<60000).length>=st.ratePerMin)throw E(429,'Límite de tasa: máximo '+st.ratePerMin+' entrenamientos por minuto por usuario.');
  const errs=[],a=DB.architectures.find(x=>x.id===f.architecture_id&&x.project_id===pid),d=DB.datasets.find(x=>x.id===f.dataset_id&&x.project_id===pid);
  const ep=Math.round(+f.epochs),bs=Math.round(+f.batch),lr=+f.lr,sd=Math.round(+f.seed),opt=f.optimizer;
  if(!a)errs.push('Selecciona una arquitectura válida del proyecto.');
  if(!d)errs.push('Selecciona un dataset válido del proyecto.');
  let pcount=0;
  if(a){
    const v=validateArch(a.family,a.config_json,st.maxLayers);pcount=v.params;
    if(!v.ok)errs.push('La arquitectura no es válida: '+v.errors[0]);
    if(!FAMS[a.family].train)errs.push('La familia '+a.family+' está documentada, pero su entrenamiento aún no está habilitado (MVP: Feedforward).');
    else if(v.params>st.maxParams)errs.push('La red tiene '+v.params+' parámetros; el máximo configurado es '+st.maxParams+'.');
    if(d&&FAMS[a.family].train&&v.ok){
      const m=d.metadata_json,c=a.config_json,K=m.classes.length;
      if(c.input[0]!==m.nFeat)errs.push('La entrada de la red ('+c.input[0]+') no coincide con las variables del dataset ('+m.nFeat+').');
      if(!(c.out===1?K===2:c.out===K))errs.push('La salida de la red ('+c.out+' neuronas) no coincide con las '+K+' clases del dataset.');
    }
  }
  if(!isInt(ep,1,st.maxEpochs))errs.push('Las épocas deben estar entre 1 y '+st.maxEpochs+'.');
  if(!isInt(bs,1,512))errs.push('El tamaño de lote debe estar entre 1 y 512.');
  if(!(lr>0&&lr<=1))errs.push('La tasa de aprendizaje debe estar entre 0 y 1.');
  if(!OPTS[opt])errs.push('Optimizador no reconocido.');
  if(!isInt(sd,0,999999))errs.push('La semilla debe ser un entero entre 0 y 999999.');
  if(errs.length)throw E(422,'No se puede iniciar el entrenamiento.',errs);
  if(DB.training_jobs.filter(j=>j.project_id===pid&&isActive(j)).length>=st.maxActiveJobsPerProject)throw E(409,'El proyecto alcanzó el máximo de '+st.maxActiveJobsPerProject+' entrenamientos activos o en cola.');
  const id=rid('j'),params={epochs:ep,batch:bs,optimizer:opt,lr,seed:sd};
  const j={id,project_id:pid,architecture_id:a.id,dataset_id:d.id,status:'QUEUED',progress:0,created_by:u.id,priority:r==='admin'?3:r==='owner'?2:1,created_at:now(),started_at:null,ended_at:null,state_reason:'',
    params_json:params,snapshot_json:{code_version:'neurolab-web 1.0.0',architecture:{name:a.name,version:a.version,family:a.family,params:pcount,config:clone(a.config_json)},dataset:{name:d.name,version:d.version,rows:d.metadata_json.rows,split:d.metadata_json.split,nFeat:d.metadata_json.nFeat,classes:d.metadata_json.classes},params},
    result_json:null,notes:'',label:cleanText(f.label,60),retry_of:f.retry_of||null,cancel_requested:false,last_json:{epoch:0},logs_json:[]};
  jlog(j,'En cola con prioridad '+j.priority+(j.retry_of?' (reintento)':''));
  DB.training_jobs.push(j);
  audit('entrenamiento_iniciado',pid,{job:id,arquitectura:a.name,dataset:d.name,epocas:ep});persist();bus.emit({type:'job',id});
  setTimeout(schedule,0);return id;
});

function adminOnly(){const u=me();if(u.role!=='admin'){audit('acceso_denegado',null,{recurso:'administración'});throw E(403,'Solo el administrador accede a este módulo.');}return u;}
svc.listUsers=def('GET','/api/v1/admin/users',async()=>{adminOnly();return DB.users.slice();});
function pwOk(p){p=String(p||'');if(p.length<8||p.length>128)throw E(422,'La contraseña debe tener entre 8 y 128 caracteres.');return p;}
async function newCred(p){const salt=Array.from(crypto.getRandomValues(new Uint8Array(16))).map(x=>x.toString(16).padStart(2,'0')).join('');return{salt,password_hash:await pwHash(pwOk(p),salt)};}
svc.createUser=def('POST','/api/v1/admin/users',async f=>{
  adminOnly();
  const un=String(f.username||'').trim().toLowerCase(),name=cleanText(f.display_name,80),em=cleanText(f.email,120);
  if(!/^[a-z0-9._-]{3,32}$/.test(un))throw E(422,'El usuario debe tener de 3 a 32 caracteres: letras, números, punto, guion o guion bajo.');
  if(!name)throw E(422,'Escribe el nombre a mostrar.');
  if(DB.users.some(x=>String(x.username||'').toLowerCase()===un))throw E(409,'Ese usuario ya existe.');
  if(!['admin','user'].includes(f.role))throw E(422,'Rol no válido.');

/* ===== Worker de entrenamiento (hilo principal, con cola y estados persistidos) ===== */
function schedule(){
  if(NOSCHED)return;
  confirmQueuedCancels();
  let active=DB.training_jobs.filter(j=>j.status==='PREPARING'||j.status==='RUNNING').length;
  const q=DB.training_jobs.filter(j=>j.status==='QUEUED').sort((a,b)=>b.priority-a.priority||a.created_at-b.created_at);
  while(active<S().maxConcurrent&&q.length){active++;runJob(q.shift());}
}
function recoverJobs(){
  DB.training_jobs.forEach(j=>{if((j.status==='PREPARING'||j.status==='RUNNING')&&!RUNNING[j.id])transition(j,'FAILED','Worker interrumpido: la página se cerró o recargó durante el entrenamiento. Se conservaron el estado y las métricas ya registradas.');});
}
function buildModel(cfg,seedN,lr,opt){
  const tf=window.tf,m=tf.sequential();let first=true,i=0;
  const ini=()=>({kernelInitializer:tf.initializers.glorotUniform({seed:seedN+(i++)}),...(first?{inputShape:[cfg.input[0]]}:{})});
  cfg.layers.forEach(l=>{
    if(l.type==='dense')m.add(tf.layers.dense({units:l.units,activation:l.act,...ini()}));
    else m.add(tf.layers.dropout({rate:l.rate,...(first?{inputShape:[cfg.input[0]]}:{})}));
    first=false;
  });
  const n=cfg.out;
  m.add(tf.layers.dense({units:n,activation:n===1?'sigmoid':'softmax',...ini()}));
  m.compile({optimizer:tf.train[opt](lr),loss:n===1?'binaryCrossentropy':'categoricalCrossentropy',metrics:['accuracy']});
  return m;
}
const argmax=a=>{let b=0;for(let i=1;i<a.length;i++)if(a[i]>a[b])b=i;return b;};
async function runJob(j){
  RUNNING[j.id]=true;const t0=now(),st=S();let model=null,T=null,stopWhy='';
  try{
    transition(j,'PREPARING');
    if(typeof window.tf==='undefined')throw new Error('TensorFlow.js no está disponible (no se pudo cargar desde la red).');
    await window.tf.ready();
    const tf=window.tf;
    if(st.backend!==tf.getBackend()){try{await tf.setBackend(st.backend);}catch(e){jlog(j,'Backend '+st.backend+' no disponible; se usa '+tf.getBackend());}}
    const ds=DB.datasets.find(x=>x.id===j.dataset_id),sn=j.snapshot_json,P=j.params_json;
    if(!ds)throw new Error('El dataset ya no existe.');
    const rows=getRows(ds),n=rows.X.length,sp=splitIdx(n,P.seed,sn.dataset.split),nf=rows.X[0].length,K=rows.classes.length,out=sn.architecture.config.out;
    const mean=[],sd=[];
    for(let f=0;f<nf;f++){let m=0;sp.tr.forEach(k=>{m+=rows.X[k][f];});m/=sp.tr.length;let v=0;sp.tr.forEach(k=>{v+=Math.pow(rows.X[k][f]-m,2);});mean.push(m);sd.push(Math.sqrt(v/sp.tr.length)||1);}
    const Z=rows.X.map(r=>r.map((v,k)=>(v-mean[k])/sd[k]));
    const yT=ids=>out===1?tf.tensor2d(ids.map(k=>[rows.y[k]])):tf.oneHot(tf.tensor1d(ids.map(k=>rows.y[k]),'int32'),K).cast('float32');
    const mk=ids=>({x:tf.tensor2d(ids.map(k=>Z[k])),y:yT(ids)});
    const a=mk(sp.tr),b=mk(sp.va),c=mk(sp.te);T=[a.x,a.y,b.x,b.y,c.x,c.y];
    model=buildModel(sn.architecture.config,P.seed,P.lr,P.optimizer);
    jlog(j,'Modelo construido ('+sn.architecture.params+' parámetros). Semilla '+P.seed+'.');
    if(j.cancel_requested){transition(j,'CANCELLED','Cancelado por solicitud del usuario antes de entrenar (confirmado por el worker).');return;}
    transition(j,'RUNNING');
    const E_=P.epochs;
    await model.fit(a.x,a.y,{epochs:E_,batchSize:P.batch,validationData:[b.x,b.y],shuffle:true,callbacks:{onEpochEnd:async(ep,logs)=>{
      const m={loss:logs.loss,accuracy:logs.acc!=null?logs.acc:logs.accuracy,val_loss:logs.val_loss,val_accuracy:logs.val_acc!=null?logs.val_acc:logs.val_accuracy};
      Object.keys(m).forEach(k=>DB.training_metrics.push({id:j.id+'-'+(ep+1)+'-'+k,job_id:j.id,epoch:ep+1,metric_name:k,metric_value:+m[k].toFixed(6),recorded_at:now()}));
      j.progress=Math.round((ep+1)/E_*100);j.last_json={epoch:ep+1,loss:m.loss,acc:m.accuracy,val_loss:m.val_loss,val_acc:m.val_accuracy};
      if(ep%3===0||ep===E_-1)LIVEW[j.id]=model.getWeights().map(w=>({shape:w.shape,data:Array.from(w.dataSync())}));
      persist();bus.emit({type:'job',id:j.id});
      if(j.cancel_requested){model.stopTraining=true;stopWhy='cancel';}
      else if(now()-t0>st.maxJobSeconds*1000){model.stopTraining=true;stopWhy='time';}
      else if(tf.memory().numBytes>st.memoryMB*1048576){model.stopTraining=true;stopWhy='mem';}
      if(st.cpuPauseMs>0)await new Promise(r=>setTimeout(r,st.cpuPauseMs));else await tf.nextFrame();
    }}});
    if(stopWhy==='cancel'){transition(j,'CANCELLED','Cancelado por solicitud del usuario; el worker confirmó la parada en la época '+j.last_json.epoch+'.');return;}
    if(stopWhy==='time'){transition(j,'FAILED','Duración máxima excedida ('+st.maxJobSeconds+' s).');return;}
    if(stopWhy==='mem'){transition(j,'FAILED','Límite de memoria excedido ('+st.memoryMB+' MB).');return;}
    const ev=model.evaluate(c.x,c.y,{batchSize:256}),teLoss=(await ev[0].data())[0],teAcc=(await ev[1].data())[0];tf.dispose(ev);
    const P2=model.predict(c.x).arraySync(),cm=Array.from({length:K},()=>new Array(K).fill(0));
    sp.te.forEach((idx,i)=>{const pr=out===1?(P2[i][0]>0.5?1:0):argmax(P2[i]);cm[rows.y[idx]][pr]++;});
    const s=series(j.id),L=s.accuracy.length-1,weights=model.getWeights().map(w=>({shape:w.shape,data:Array.from(w.dataSync()).map(v=>+v.toFixed(5))}));
    LIVEW[j.id]=weights;
    const json=JSON.stringify({weights});
    if(usageKB()+json.length/1024>st.quotaKB)throw new Error('Cuota de almacenamiento agotada ('+st.quotaKB+' KB): no se pudo guardar el modelo. Libera espacio o aumenta el límite.');
    const vid=rid('mv'),ver=Math.max(0,...DB.model_versions.filter(v=>v.project_id===j.project_id).map(v=>v.version))+1;
    DB.objects['model_'+vid]={kind:'model',content:json};
    j.result_json={trAcc:s.accuracy[L],vaAcc:s.val_accuracy[L],teAcc,teLoss,cm,params:sn.architecture.params,duration_ms:now()-t0,epochs_done:L+1,classes:rows.classes};
    DB.model_versions.push({id:vid,project_id:j.project_id,job_id:j.id,version:ver,storage_key:'model_'+vid,status:'borrador',checksum:await sha256(json),created_at:now(),created_by:j.created_by,
      meta_json:{arch:sn.architecture.name+' v'+sn.architecture.version,dataset:sn.dataset.name+' v'+sn.dataset.version,params:sn.architecture.params,test_acc:teAcc,test_loss:teLoss,epochs:P.epochs,optimizer:P.optimizer,lr:P.lr,seed:P.seed}});
    audit('modelo_creado',j.project_id,{version:ver,job:j.id},'worker');
    transition(j,'COMPLETED','Entrenamiento finalizado. Versión '+ver+' registrada como borrador.');
  }catch(e){
    console.error(e);
    if(!TERMINAL.includes(j.status)){j.tech_note=String(e&&e.stack||e).slice(0,400);transition(j,'FAILED',(e&&e.message)?e.message:'Error durante el entrenamiento.');}
  }finally{
    if(T&&window.tf)window.tf.dispose(T);if(model){try{model.dispose();}catch(e){}}
    delete RUNNING[j.id];schedule();
  }
}

  if(!SES){g('root').innerHTML=flashHTML()+loginHTML();U.flash=null;return;}
  if(!g('content'))g('root').innerHTML=shellHTML();
  LIVE=null;
  let out;
  try{
    await header();await loadProj();
    out=await V[U.view]();
  }catch(e){
    if(e instanceof HttpError&&e.status===401){SES=null;return render();}
    out={h:'<div class="banner bad">'+esc(e instanceof HttpError?e.message:'No se pudo mostrar este módulo.')+'</div>'};if(!(e instanceof HttpError))console.error(e);
  }
  if(my!==RID)return;
  const c=g('content');c.innerHTML=flashHTML()+out.h;U.flash=null;
  if(out.f)out.f();
  g('app').classList.remove('open');
}
function go(view){U.view=view;if(view==='proyectos')U.open=false;U.confirm=null;try{if(location.hash!=='#'+view)history.replaceState(null,'','#'+view);}catch(e){}render();}

function demoTarget(){
  const u=me();
  for(const p of visible(u)){
    if(!canDo(roleOf(p,u),'write'))continue;
    for(const a of DB.architectures.filter(x=>x.project_id===p.id&&x.family==='Feedforward')){
      const d=DB.datasets.find(x=>x.project_id===p.id&&x.metadata_json.nFeat===a.config_json.input[0]&&(a.config_json.out===1?x.metadata_json.classes.length===2:x.metadata_json.classes.length===a.config_json.out));
      if(d)return{pid:p.id,a,d};
    }
  }
  return null;
}

/* ===== Visor 3D de redes neuronales (Three.js) ===== */
const CAP=32;
const shpNums=s=>(String(s).match(/\d+/g)||[]).map(Number);
function spec3D(family,cfg,rows){
  if(family==='Feedforward'){
    const L=[{n:cfg.input[0],label:'Entrada',sub:cfg.input[0]+' var.',k:'in'}];
    cfg.layers.filter(l=>l.type==='dense').forEach((l,i)=>L.push({n:l.units,label:'Oculta '+(i+1),sub:l.units+' · '+l.act,k:'hid'}));
    L.push({n:cfg.out,label:'Salida',sub:cfg.out+' · '+(cfg.out===1?'sigmoid':'softmax'),k:'out'});
    return{mode:'neurons',stacks:[{title:'',layers:L}]};
  }
  if(family==='GAN'){
    const mk=(inn,ls,outn,lab)=>[{n:inn,label:lab,sub:inn+'',k:'in'}].concat(ls.filter(l=>l.type==='dense').map((l,i)=>({n:l.units,label:'Oculta '+(i+1),sub:l.units+' · '+l.act,k:'hid'})),[{n:outn,label:'Salida',sub:outn+'',k:'out'}]);
    return{mode:'neurons',stacks:[{title:'Generador',layers:mk(cfg.latent_dim,cfg.generator,cfg.data_dim,'Ruido')},{title:'Discriminador',layers:mk(cfg.data_dim,cfg.discriminator,1,'Datos')}]};
  }
  return{mode:'blocks',blocks:(rows||[]).map(r=>({label:r.name.replace(/^C\d+ · /,''),sub:r.shape,shape:shpNums(r.shape)}))};
}
function spec3DFromArch(family,cfg){const v=validateArch(family,cfg);return v.ok?spec3D(family,cfg,v.rows):null;}

    if(this.inst)this.inst.setSpec(spec);
  },

  dispose(){if(this.inst){this.inst.dispose();this.inst=null;}},
  create(box,opts){
    const T=window.THREE;let renderer;
    box.innerHTML='<canvas aria-label="Red neuronal en 3D: arrastra para girar, usa la rueda para acercar" role="img"></canvas><div class="tb"><button class="btn" data-k="rot">Giro: sí</button><button class="btn" data-k="pulse">Pulso: sí</button><button class="btn" data-k="reset">Reiniciar vista</button><button class="btn" data-k="in">＋</button><button class="btn" data-k="out">－</button></div><div class="hintb">Arrastra para girar · rueda para acercar</div>';

    const scene=new T.Scene(),cam=new T.PerspectiveCamera(45,1.6,0.1,200);
    scene.add(new T.AmbientLight(0xffffff,0.75));const dl=new T.DirectionalLight(0xffffff,0.8);dl.position.set(4,8,6);scene.add(dl);
    const grp=new T.Group();scene.add(grp);
    const st={th:-0.9,ph:1.2,rad:14,tgt:new T.Vector3(),rot:opts.rot!==false,pulse:true,t0:performance.now(),layerMats:[],pairs:[],nLayers:1,defRad:14};
    const ac=new AbortController(),sig={signal:ac.signal};

    const label=(txt,sub,x,y,z)=>{

    const mix=(w,m)=>{const t=Math.min(1,Math.abs(w)/(m||1)),n=[0.55,0.6,0.68],s=w>=0?[0.18,0.5,1]:[1,0.5,0.1];return n.map((v,i)=>v+(s[i]-v)*t);};

              pos.push(pl);maxX=Math.max(maxX,li*GX);

            });

              A_.forEach(a=>B_.forEach(b=>{ids.push([a.id,b.id]);pa.push(a.x,a.y,a.z,b.x,b.y,b.z);co.push(.55,.6,.68,.55,.6,.68);}));

          bl.forEach((b,i)=>{

            const mat=new T.MeshStandardMaterial({color:col,transparent:true,opacity:0.6,roughness:0.5,emissive:col,emissiveIntensity:0.1});st.layerMats.push(mat);
            const mesh=new T.Mesh(new T.BoxGeometry(w,h,d),mat);x+=w/2;mesh.position.set(x,0,0);grp.add(mesh);

            grp.add(label(b.label.slice(0,14),b.sub,x,h/2+1.1,0));maxY=Math.max(maxY,h);prev=x+w/2;x+=w/2+1.6;

    const loop=()=>{
      if(!alive)return;if(!box.isConnected){I.dispose();if(Net3D.inst===I)Net3D.inst=null;return;}
      const t=(performance.now()-st.t0)/1000;
      if(st.rot&&!drag)st.th+=0.004;
      cam.position.set(st.tgt.x+st.rad*Math.sin(st.ph)*Math.cos(st.th),st.tgt.y+st.rad*Math.cos(st.ph),st.tgt.z+st.rad*Math.sin(st.ph)*Math.sin(st.th));cam.lookAt(st.tgt);

function diagram2D(spec){
  if(spec.mode==='blocks'){
    const bl=spec.blocks,W=bl.length*128+20;
    return '<svg viewBox="0 0 '+W+' 120" width="'+W+'" height="120" role="img" aria-label="Diagrama de bloques de la red">'+bl.map((b,i)=>'<rect class="bx" x="'+(10+i*128)+'" y="22" width="104" height="46" rx="5"/><text class="tl" x="'+(62+i*128)+'" y="42" text-anchor="middle">'+esc(b.label.slice(0,14))+'</text><text class="sl" x="'+(62+i*128)+'" y="58" text-anchor="middle">'+esc(b.sub)+'</text>'+(i?'<line class="ln" x1="'+(i*128-4)+'" y1="45" x2="'+(10+i*128)+'" y2="45"/>':'')).join('')+'</svg>';
  }
  return spec.stacks.map(s=>{
    const cols=s.layers,gap=112,W=cols.length*gap+16,H=200,MAXN=7,sp=24,cy=84;
    const pos=cols.map((c,i)=>Array.from({length:Math.min(c.n,MAXN)},(_,j)=>({x:50+i*gap,y:cy+(j-(Math.min(c.n,MAXN)-1)/2)*sp})));
    let o='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Diagrama de la red '+esc(s.title)+'">';
    for(let i=0;i<cols.length-1;i++)pos[i].forEach(a=>pos[i+1].forEach(b=>{o+='<line class="ln" x1="'+a.x+'" y1="'+a.y+'" x2="'+b.x+'" y2="'+b.y+'"/>';}));
    cols.forEach((c,i)=>{pos[i].forEach(p=>{o+='<circle class="nd'+(c.k==='out'?' out':'')+'" cx="'+p.x+'" cy="'+p.y+'" r="7"/>';});o+='<text class="tl" x="'+(50+i*gap)+'" y="'+(H-30)+'" text-anchor="middle">'+esc(c.label)+'</text><text class="sl" x="'+(50+i*gap)+'" y="'+(H-14)+'" text-anchor="middle">'+esc(c.sub)+'</text>';});
    return (s.title?'<h3 style="margin:8px 0 0">'+esc(s.title)+'</h3>':'')+'<div class="scroll">'+o+'</svg></div>';
  }).join('');
}

const ACTF={relu:x=>Math.max(0,x),tanh:Math.tanh,sigmoid:x=>1/(1+Math.exp(-x)),elu:x=>x>=0?x:Math.exp(x)-1,linear:x=>x};

const EXAMPLES=[['Círculos: la capa oculta importa','Dos anillos no se separan con una línea. Una capa oculta pequeña ya lo logra.','Feedforward',{input:[2],layers:[{type:'dense',units:8,act:'tanh'}],out:1}],['XOR: una neurona no basta','Sin capa oculta la red solo traza una recta y no resuelve XOR.','Feedforward',{input:[2],layers:[{type:'dense',units:6,act:'relu'},{type:'dense',units:4,act:'relu'}],out:1}],['Espiral: más capas y neuronas','Tres brazos enroscados piden una red más profunda.','Feedforward',{input:[2],layers:[{type:'dense',units:32,act:'relu'},{type:'dense',units:16,act:'relu'},{type:'dense',units:8,act:'relu'}],out:3}]];

function neuronUpdate(){
  const v=id=>parseFloat(g('nu-'+id).value),act=g('nu-act').value;
  ['x1','x2','w1','w2','b'].forEach(k=>{g('o-'+k).textContent=v(k).toFixed(1);});

  g('nu-res').textContent='z = '+z.toFixed(2)+'  →  '+act+'(z) = '+y.toFixed(3);
  const c=g('nu-cv'),r=c.getBoundingClientRect();if(!r.width)return;
  const dpr=window.devicePixelRatio||1;c.width=r.width*dpr;c.height=r.height*dpr;const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);
  const w=r.width,h=r.height,m=28;x.fillStyle=cssVar('--surface');x.fillRect(0,0,w,h);

}

/* ===== Gráficos de curvas ===== */
function drawLines(id,series,o){
  const c=g(id);if(!c)return;const r=c.getBoundingClientRect();if(!r.width||!r.height)return;
  const dpr=window.devicePixelRatio||1;c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);
  const x=c.getContext('2d');x.setTransform(dpr,0,0,dpr,0,0);const w=r.width,h=r.height,m={l:40,r:12,t:12,b:24},pw=w-m.l-m.r,ph=h-m.t-m.b;
  x.fillStyle=cssVar('--surface');x.fillRect(0,0,w,h);
  const all=[];series.forEach(s=>s.data.forEach(v=>{if(isFinite(v))all.push(v);}));
  const n=Math.max(o.n||2,2),ymax=o.ymax!=null?o.ymax:Math.max(0.1,...all)*1.08;
  const X=e=>m.l+e/(n-1)*pw,Y=v=>m.t+ph-v/ymax*ph;
  x.font='11px '+cssVar('--f-mono');x.lineWidth=1;
  for(let i=0;i<=4;i++){const v=ymax*i/4,y=Y(v);x.strokeStyle=cssVar('--line');x.beginPath();x.moveTo(m.l,y);x.lineTo(w-m.r,y);x.stroke();x.fillStyle=cssVar('--muted');x.textAlign='right';x.textBaseline='middle';x.fillText(v.toFixed(o.dec),m.l-6,y);}
  x.textAlign='center';x.textBaseline='top';for(let j=0;j<5;j++){const e=Math.round((n-1)*j/4);x.fillStyle=cssVar('--muted');x.fillText(String(e+1),X(e),h-m.b+6);}
  series.forEach(s=>{
    x.strokeStyle=s.color;x.lineWidth=2;x.setLineDash(s.dash||[]);x.beginPath();let st=false,last=-1;
    for(let e=0;e<s.data.length;e++){const v=s.data[e];if(!isFinite(v))continue;if(!st){x.moveTo(X(e),Y(v));st=true;}else x.lineTo(X(e),Y(v));last=e;}
    x.stroke();x.setLineDash([]);
    if(last>=0){x.fillStyle=s.color;x.beginPath();x.arc(X(last),Y(s.data[last]),3.5,0,6.3);x.fill();}
  });
}

  U.cmp=U.cmp.filter(id=>jobs.some(j=>j.id===id));

  if(U.cmp.length>=2){
    const cs=U.cmp.map(id=>jobs.find(j=>j.id===id));
    h+='<section class="panel"><div class="ph"><h2>Comparación de ejecuciones</h2></div><div class="charts"><div><h3 class="muted" style="font-size:12px;margin-bottom:4px">EXACTITUD DE VALIDACIÓN</h3><canvas id="cmpA" class="chart" role="img" aria-label="Comparación de exactitud de validación"></canvas></div><div><h3 class="muted" style="font-size:12px;margin-bottom:4px">PÉRDIDA DE VALIDACIÓN</h3><canvas id="cmpL" class="chart" role="img" aria-label="Comparación de pérdida de validación"></canvas></div></div><div class="legend">'+cs.map((j,i)=>'<span><i style="background:'+PAL[i%6]+'"></i>'+esc(j.no+' · '+j.arch)+'</span>').join('')+'</div></section>';
  }
  h+='<div class="g2"><section class="panel"><div class="ph"><h2>'+esc(fj.no)+' · '+esc(fj.arch)+'</h2>'+pill(fj.status)+'</div>';
  if(r){
    const gap=r.trAcc-r.teAcc;
    h+='<div class="tiles"><div class="tile"><span>Exact. entrenamiento</span><b>'+pct(r.trAcc)+'</b></div><div class="tile"><span>Exact. validación</span><b>'+pct(r.vaAcc)+'</b></div><div class="tile"><span>Exact. prueba</span><b>'+pct(r.teAcc)+'</b></div><div class="tile"><span>Pérdida prueba</span><b>'+r.teLoss.toFixed(3)+'</b></div></div>'
    +(gap>0.08?'<div class="banner warn" style="margin-top:10px">Señal de sobreajuste: entrenamiento supera a prueba por '+(gap*100).toFixed(1)+' puntos.</div>':'')
    +'<h3 style="margin:12px 0 6px">Matriz de confusión (datos de prueba)</h3><div class="scroll"><table class="cm" style="border-collapse:collapse"><tr><th>Real \\ Predicho</th>'+r.classes.map(c=>'<th>'+esc(c)+'</th>').join('')+'</tr>'+r.cm.map((row,i)=>{const mx=Math.max(1,...r.cm.flat());return '<tr><th>'+esc(r.classes[i])+'</th>'+row.map((v,k)=>'<td style="background:color-mix(in srgb,var(--'+(i===k?'accent':'bad')+') '+Math.round(v/mx*(i===k?60:45))+'%,transparent)">'+v+'</td>').join('')+'</tr>';}).join('')+'</table></div>';
  }else h+='<p class="hint">Este trabajo se detuvo antes de la evaluación final.</p>';

  +'<h3 style="margin:14px 0 6px">Limitaciones y observaciones</h3>'+(can('write')?'<form data-form="notes" data-id="'+esc(fj.id)+'"><textarea id="ev-notes" name="notes" maxlength="1500" aria-label="Limitaciones y observaciones">'+esc(fj.notes)+'</textarea><div class="row" style="margin-top:8px"><button class="btn" type="submit">Guardar observaciones</button></div></form>':'<p>'+esc(fj.notes||'Sin observaciones.')+'</p>')+'</section></div>';
  return{h,f:()=>{
    drawJobCharts(d.series,d.job.params_json.epochs);
    if(U.cmp.length>=2){const cs=U.cmp.map(id=>series(id)),n=Math.max(...U.cmp.map(id=>jobs.find(j=>j.id===id).params_json.epochs));drawLines('cmpA',cs.map((s,i)=>({data:s.val_accuracy,color:PAL[i%6]})),{dec:2,ymax:1,n});drawLines('cmpL',cs.map((s,i)=>({data:s.val_loss,color:PAL[i%6]})),{dec:2,n});}
    const sn=fj.snapshot_json.architecture,sp=spec3DFromArch(sn.family,sn.config);if(sp){Net3D.show('ev3d',sp);const w=jobWeights(fj.id);if(w)Net3D.setWeights(w);}
  }};
};

/* ===== Descargas y copiado ===== */
let DLC=null;
async function getDL(){if(DLC!==null)return DLC;try{DLC=(window.claude&&window.claude.use)?await window.claude.use('downloads'):false;}catch(e){DLC=false;}return DLC||false;}
async function saveText(name,text){
  const d=await getDL();
  if(!d&&!window.claude){try{const bl=new Blob([text],{type:'text/csv;charset=utf-8'}),url=URL.createObjectURL(bl),a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),4000);setFlash('Descarga iniciada: '+name+'.');return true;}catch(e){setFlash('No se pudo iniciar la descarga de '+name+'. Usa «Copiar».','warn');return false;}}
  if(!d){setFlash('La descarga no está disponible en esta vista. Usa «Copiar» y pega el contenido en un archivo.','warn');return false;}
  try{await d.save({filename:name,data:text});setFlash('Archivo ofrecido para guardar: '+name+'.');return true;}
  catch(e){if(!e||e.code!=='declined')setFlash('No se pudo guardar '+name+' ('+((e&&e.code)||'error')+'). Usa «Copiar».','warn');return false;}
}
const textOf=id=>{const f=g(id+'full')||g(id);return f?(f.value!==undefined&&f.tagName==='TEXTAREA'?f.value:f.textContent):'';};
A.copy=el=>{
  const t=textOf(el.dataset.t),b=el,old=b.textContent,ok=m=>{b.textContent=m;setTimeout(()=>{b.textContent=old;},1600);};
  try{navigator.clipboard.writeText(t).then(()=>ok('Copiado'),()=>{const r=document.createRange(),p=g(el.dataset.t);if(p){r.selectNodeContents(p);const s=getSelection();s.removeAllRanges();s.addRange(r);}ok('Selecciona y copia');});}
  catch(e){ok('Selecciona y copia');}
};

function reportData(kind,jobs){
  const p=U.proj.p,csv=a=>a.map(r=>r.map(csvCell).join(',')).join('\n')+'\n';
  if(kind==='ficha'){
    const rows=[['Nombre',p.name],['Descripción',p.description],['Estado',p.status],['Propietario',uname(p.owner_id)],['Miembros',DB.project_members.filter(m=>m.project_id===p.id).map(m=>uname(m.user_id)+' ('+ROLE_ES[m.role]+')').join('; ')],['Etiquetas',p.tags.join(', ')],['Creado',fmtDT(p.created_at)],['Arquitecturas',DB.architectures.filter(x=>x.project_id===p.id).length],['Datasets',DB.datasets.filter(x=>x.project_id===p.id).length],['Entrenamientos',DB.training_jobs.filter(x=>x.project_id===p.id).length],['Modelos aprobados',DB.model_versions.filter(x=>x.project_id===p.id&&x.status==='aprobado').length]];
    return{html:'<dl class="kv">'+rows.map(r=>'<dt>'+esc(r[0])+'</dt><dd>'+esc(r[1]||'—')+'</dd>').join('')+'</dl>',csv:csv([['campo','valor']].concat(rows)),name:'ficha_proyecto.csv'};
  }
  if(kind==='arquitectura'){
    const as=DB.architectures.filter(x=>x.project_id===p.id).sort((a,b)=>b.created_at-a.created_at),rows=[['arquitectura','version','familia','capa','forma_salida','parametros']];
    let html='';
    as.forEach(a=>{const v=validateArch(a.family,a.config_json);v.rows.forEach(r=>rows.push([a.name,a.version,a.family,r.name,r.shape,r.params]));html+='<h3 style="margin:12px 0 6px">'+esc(a.name)+' v'+a.version+' · '+esc(a.family)+' · '+v.params.toLocaleString('es-PE')+' parámetros</h3>'+tbl(['Capa','Forma','#Parámetros'],v.rows.map(r=>'<tr><td>'+esc(r.name)+'</td><td class="mono">'+esc(r.shape)+'</td><td class="n mono">'+r.params+'</td></tr>'));});
    return{html:html||'<p class="hint">Sin arquitecturas.</p>',csv:csv(rows),name:'resumen_arquitectura.csv'};
  }
  const rows=[['entrenamiento','fecha','duracion_s','estado','arquitectura','dataset','optimizador','tasa_aprendizaje','epocas','lote','semilla','exactitud_val','exactitud_prueba']];
  jobs.forEach(j=>{const P=j.params_json,r=j.result_json;rows.push([j.no,new Date(j.created_at).toISOString(),j.dur!=null?Math.round(j.dur/1000):'',j.status,j.arch,j.dataset,P.optimizer,P.lr,P.epochs,P.batch,P.seed,(j.last_json&&j.last_json.val_acc!=null)?j.last_json.val_acc.toFixed(4):'',r?r.teAcc.toFixed(4):'']);});
  return{html:jobs.length?tbl(rows[0].map(h=>h.replace(/_/g,' ')),rows.slice(1).map(r=>'<tr>'+r.map(c=>'<td class="mono">'+esc(c)+'</td>').join('')+'</tr>')):'<p class="hint">Sin entrenamientos.</p>',csv:csv(rows),name:'historial_entrenamiento.csv'};
}

let lt=0;const live=()=>{if(lt)return;lt=setTimeout(()=>{lt=0;if(LIVE&&SES)LIVE();},250);};
function boot(){
  let loaded=null;try{const r=localStorage.getItem(LSK);if(r)loaded=JSON.parse(r);}catch(e){}
  DB=loaded&&loaded.projects&&loaded.users?loaded:seed();
  DB.settings=Object.assign({},DEFAULTS,DB.settings);if(!DB.objects)DB.objects={};
  try{SES=sessionStorage.getItem(LSS)||null;}catch(e){}
  if(SES&&!DB.users.find(u=>u.id===SES&&u.status==='activo'))SES=null;
  recoverJobs();
  bus.ls.push(()=>live());
  const h=(location.hash||'').slice(1);if(MODS.some(m=>m[1]===h))U.view=h;
  document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e);}});
  document.addEventListener('submit',e=>{const f=e.target.closest('form[data-form]');if(!f)return;e.preventDefault();const fn=F[f.dataset.form];if(fn)fn(f);});
  document.addEventListener('input',e=>{const el=e.target.closest('[data-bind]');if(!el||el.tagName==='SELECT'||el.type==='checkbox'||el.type==='file')return;const fn=B[el.dataset.bind];if(fn)fn(el,'input');});
  document.addEventListener('change',e=>{const el=e.target.closest('[data-bind]');if(!el)return;const fn=B[el.dataset.bind];if(fn)fn(el,'change');});
  window.addEventListener('hashchange',()=>{const v=location.hash.slice(1);if(SES&&MODS.some(m=>m[1]===v)&&v!==U.view){U.view=v;if(v==='proyectos')U.open=false;render();}});
  let rz=0,lw=window.innerWidth;window.addEventListener('resize',()=>{if(window.innerWidth===lw)return;lw=window.innerWidth;clearTimeout(rz);rz=setTimeout(()=>{if(SES)render();},250);});
  new MutationObserver(()=>{if(SES)render();}).observe(document.documentElement,{attributes:true,attributeFilter:['data-theme']});
  try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(SES)render();});}catch(e){}
  render();schedule();
}
boot();
